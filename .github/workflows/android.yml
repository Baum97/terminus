name: Android-App bauen

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.TERMINUS_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Schulferien laden (OpenHolidays)
        run: node scripts/ferien.mjs || echo "::warning::Ferien-Daten nicht geladen, App zeigt nur Feiertage"

      - name: Web-App in die Android-App kopieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../terminus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: terminus-apk
          path: terminus.apk

      # Mit eigenem Schlüssel (Secrets TERMINUS_KEYSTORE_BASE64 und TERMINUS_KEYSTORE_PASSWORD)
      # wird bei einem Tag eine signierte Release-APK gebaut, sonst gibt es nur die Test-Version.
      - name: Signierte Release-APK bauen
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 != ''
        working-directory: android
        env:
          TERMINUS_KEYSTORE_PASSWORD: ${{ secrets.TERMINUS_KEYSTORE_PASSWORD }}
          TERMINUS_KEY_ALIAS: ${{ secrets.TERMINUS_KEY_ALIAS }}
          TERMINUS_KEY_PASSWORD: ${{ secrets.TERMINUS_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          TERMINUS_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease --no-daemon
          rm -f "$RUNNER_TEMP/release.jks"
          cp app/build/outputs/apk/release/app-release.apk "../terminus-$GITHUB_REF_NAME.apk"

      - name: Release mit APK anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls terminus-v*.apk >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" terminus-v*.apk --title "Terminus $GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" terminus.apk --title "Terminus $GITHUB_REF_NAME" --notes "Test-Version zum direkten Installieren (APK, Test-Schlüssel)." --prerelease
          fi
