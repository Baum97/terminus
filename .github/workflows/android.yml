name: Android-App bauen

on:
  push:
    branches: ['**']
    tags: ['v*']
  # Release über die GitHub-Oberfläche angelegt: APK automatisch anhängen
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Zwei Pushes kurz hintereinander: nicht gleichzeitig dasselbe Release anlegen
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.TERMINUS_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Schulferien laden (OpenHolidays)
        run: node scripts/ferien.mjs || echo "::warning::Ferien-Daten nicht geladen, App zeigt nur Feiertage"

      - name: Web-App bauen (gebündelt und verkleinert) und in die Android-App kopieren
        run: |
          npm run build
          npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../terminus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: terminus-apk
          path: terminus.apk

      # Jede Version wird ein fertiges Release mit der APK zum direkten Installieren:
      # bei jedem Push auf main (Version aus android/app/build.gradle), bei einem Tag v* oder einem
      # über die GitHub-Oberfläche angelegten Release. Text aus fastlane/…/changelogs/<versionCode>.txt.
      - name: Version lesen
        id: ver
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          C=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' android/app/build.gradle)
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$V"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"; echo "code=$C" >> "$GITHUB_OUTPUT"; echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Mit eigenem Schlüssel (Secrets TERMINUS_KEYSTORE_BASE64 und TERMINUS_KEYSTORE_PASSWORD)
      # kommt eine signierte Release-APK ins Release, sonst die Test-Version (fester Test-Schlüssel).
      - name: Signierte Release-APK bauen
        if: steps.ver.outputs.tag != '' && env.KEYSTORE_B64 != ''
        working-directory: android
        env:
          TERMINUS_KEYSTORE_PASSWORD: ${{ secrets.TERMINUS_KEYSTORE_PASSWORD }}
          TERMINUS_KEY_ALIAS: ${{ secrets.TERMINUS_KEY_ALIAS }}
          TERMINUS_KEY_PASSWORD: ${{ secrets.TERMINUS_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          TERMINUS_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease --no-daemon
          rm -f "$RUNNER_TEMP/release.jks"
          cp app/build/outputs/apk/release/app-release.apk ../terminus-signed.apk

      - name: Release anlegen oder aktualisieren
        if: steps.ver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          V: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          mkdir -p release
          # Immer derselbe Dateiname: …/releases/latest/download/terminus.apk zeigt auf die neueste Version
          if [ -f terminus-signed.apk ]; then cp terminus-signed.apk release/terminus.apk; KEY="eigenem Schlüssel"; else cp terminus.apk release/terminus.apk; KEY="Test-Schlüssel"; fi
          LOG="fastlane/metadata/android/de-DE/changelogs/$CODE.txt"
          {
            if [ -f "$LOG" ]; then cat "$LOG"; echo; fi
            echo "**Installieren:** Unten unter „Assets“ auf \`terminus.apk\` tippen, öffnen und die Installation aus dieser Quelle erlauben. Eine schon installierte Terminus-Version wird dabei aktualisiert, die Daten bleiben."
            echo
            echo "Version $V (Build $CODE) · Stand ${GITHUB_SHA::7} · signiert mit $KEY"
          } > release/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Gleiche Version noch einmal gebaut: APK und Text ersetzen.
            # Selbst über die Oberfläche angelegt: nur die APK anhängen, der eigene Text bleibt.
            gh release upload "$TAG" release/terminus.apk --clobber
            if [ "$GITHUB_EVENT_NAME" = push ]; then gh release edit "$TAG" --notes-file release/notes.md; fi
          else
            gh release create "$TAG" release/terminus.apk --target "$GITHUB_SHA" --title "Terminus $V" --notes-file release/notes.md --latest
          fi
          echo "### Release $TAG: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
